name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a Practice Tool game in Borderless mode
        2. Press ⌃⌥1
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Summwatch version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.4, MacBook Air M2
    validations:
      required: true
  - type: dropdown
    id: display-mode
    attributes:
      label: League window mode
      options: [Fullscreen, Borderless, Windowed, Not sure]
    validations:
      required: true
  - type: dropdown
    id: game-mode
    attributes:
      label: Game mode
      options: [Summoner's Rift, ARAM, Practice Tool, Spectator, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please blur other players' names.
